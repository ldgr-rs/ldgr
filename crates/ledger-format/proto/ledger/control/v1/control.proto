syntax = "proto3";

package ledger.control.v1;

// Append-only within v1. Never reorder or renumber
// fields 1..N; new fields always take fresh numbers.

// TaskDispatch carries a single campaign task from control plane to worker.
message TaskDispatch {
  string task_id = 1;
  bytes run_config_bytes = 2;      // canonical RunConfig encoding
  string workload = 3;
  string run_config_hash_hex = 4;  // blake3 hex for boundary check
}

// LeaseRequest asks the control plane for work.
message LeaseRequest {
  string worker_id = 1;
  uint32 max_tasks = 2;
}

// LeaseResponse returns zero or more tasks for the worker lease.
message LeaseResponse {
  repeated TaskDispatch tasks = 1;
}

// ResultUpload reports a completed task result to the control plane.
// ok=false doubles as the FailTask payload convention.
message ResultUpload {
  string task_id = 1;
  string journal_root_hex = 2;
  uint64 steps = 3;
  bool ok = 4;
  string error = 5;
}

// Ack acknowledges a result upload, an acked task, a progress report, or a
// confirmed artifact upload.
message Ack {
  string task_id = 1;
  bool accepted = 2;
}

// ---------------------------------------------------------------------------
// Registration and liveness (S2)
// ---------------------------------------------------------------------------

// WorkerIdentity names a worker build.
message WorkerIdentity {
  string worker_id = 1;
  string version = 2;
}

// RuntimeProfile mirrors ledger_worker::profile::RuntimeProfile.
message RuntimeProfile {
  string engine_sha = 1;
  string toolchain = 2;
  string features = 3;
  repeated string sut_hashes = 4;
  string cpu_topology = 5;
  repeated string env_sanitation = 6;
  string fingerprint_hex = 7;
}

// RegisterWorker registers a worker build and host shape with the fleet.
message RegisterWorkerRequest {
  WorkerIdentity identity = 1;
  RuntimeProfile profile = 2;
}

// RegisterAck answers RegisterWorker.
message RegisterAck {
  string assigned_worker_id = 1;
  bool accepted = 2;
  string reason = 3;
}

// Heartbeat proves liveness while a task runs.
message HeartbeatRequest {
  string worker_id = 1;
  string task_id = 2;
  uint32 attempts = 3;
}

// HeartbeatAck answers Heartbeat.
message HeartbeatAck {
  bool lease_extended = 1;
  uint64 new_deadline_unix_s = 2;
}

// ---------------------------------------------------------------------------
// Lease management and progress (S2)
// ---------------------------------------------------------------------------

// LeaseExtend asks for extra seconds on a running lease.
message LeaseExtend {
  string worker_id = 1;
  string task_id = 2;
  uint32 extra_secs = 3;
}

// AckTask claims or completes a task lease slot.
message TaskAck {
  string task_id = 1;
  string worker_id = 2;
}

// CancelTask asks the fleet to abandon a task.
message CancelTaskRequest {
  string task_id = 1;
  string reason = 2;
}

// CancelAck answers CancelTask.
message CancelAck {
  string task_id = 1;
  bool cancelled = 2;
}

// ReportProgress reports coarse phase counters for a running task.
message TaskProgress {
  string task_id = 1;
  string phase = 2;
  map<string, uint64> counters = 3;
}

// ---------------------------------------------------------------------------
// Artifact upload (S2)
// ---------------------------------------------------------------------------

// UploadUrlRequest asks for a direct-to-storage artifact upload URL.
message UploadUrlRequest {
  string task_id = 1;
  string artifact_name = 2;
}

// UploadUrlResponse carries the method and URL for the direct upload.
message UploadUrlResponse {
  string url = 1;
  string method = 2;
}

// ConfirmUpload closes the artifact upload handshake.
message ConfirmUploadRequest {
  string task_id = 1;
  string artifact_name = 2;
  string checksum_hex = 3;
}

// ---------------------------------------------------------------------------
// Health (S2)
// ---------------------------------------------------------------------------

// HealthCheck probes one service.
message HealthCheck {
  string service = 1;
}

// HealthReply answers HealthCheck.
message HealthReply {
  bool serving = 1;
}

// ControlPlane service between control plane and worker.
service ControlPlane {
  rpc AcquireLease(LeaseRequest) returns (LeaseResponse);
  rpc UploadResult(ResultUpload) returns (Ack);
  rpc ExtendLease(LeaseExtend) returns (HeartbeatAck);
  rpc AckTask(TaskAck) returns (Ack);
  rpc CancelTask(CancelTaskRequest) returns (CancelAck);
  rpc ReportProgress(TaskProgress) returns (Ack);
}

// WorkerControl manages worker registration and task lifecycle acknowledgement.
service WorkerControl {
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterAck);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatAck);
  // CompleteTask takes a ResultUpload with ok=true.
  rpc CompleteTask(ResultUpload) returns (Ack);
  // FailTask takes a ResultUpload with ok=false and the error set.
  rpc FailTask(ResultUpload) returns (Ack);
}

// ArtifactService brokers direct-to-storage artifact uploads.
service ArtifactService {
  rpc GetUploadURL(UploadUrlRequest) returns (UploadUrlResponse);
  rpc ConfirmUpload(ConfirmUploadRequest) returns (Ack);
}

// Health serves liveness probes.
service Health {
  rpc Check(HealthCheck) returns (HealthReply);
}
