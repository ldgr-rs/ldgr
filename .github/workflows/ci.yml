name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    env:
      # Shared sccache across GitHub-hosted runners.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start sccache
        uses: mozilla/sccache-action@v0.0.11
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build debug Wasm guest artifact (needed by wasm tests)
        run: cargo build --target wasm32-wasip1 -p wasm-guest
      - name: Run tests with cargo-nextest
        run: cargo nextest run --workspace --all-features --profile ci
      - name: Run doctests
        run: cargo test --workspace --doc
      - name: Verify benchmarks compile
        run: cargo bench --no-run
      - run: cargo run -p ledger-lint -- crates/
      - name: Enforce the AGPL/Apache/MIT crate licensing split
        run: cargo run -p xtask -- licenses
      - name: Planted-leak corpus must be fully flagged
        run: |
          set +e
          cargo run -p ledger-lint -- corpora/planted-leaks/
          status=$?
          set -e
          test "$status" -eq 1

  bench-gate:
    name: Storage benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Run storage benchmarks and enforce the throughput budget
        run: |
          cargo bench -p ledger-journal --bench storage -- --output-format bencher \
            > /tmp/storage_bench.txt 2>&1
          python3 - <<'EOF'
          import re

          def point_estimate(path, name):
              # bencher output: "test append_throughput_100k ... bench: 76,787,319 ns/iter"
              for line in open(path):
                  m = re.match(rf"test {re.escape(name)}\s+\.\.\.\s+bench:\s+([0-9,]+)\s+ns/iter", line)
                  if m:
                      return float(m.group(1).replace(",", ""))
              raise AssertionError(f"benchmark {name} not found in output")

          append_ns = point_estimate("/tmp/storage_bench.txt", "append_throughput_100k")
          fork_ns = point_estimate("/tmp/storage_bench.txt", "fork_cost_1m")

          # 100k appends in ns -> entries per second. Gate: >= 1M/s/core.
          append_per_sec = 100_000.0 / (append_ns / 1e9)
          print(f"append throughput: {append_per_sec:,.0f} entries/s (gate >= 1_000_000)")
          assert append_per_sec >= 1_000_000.0, f"append gate failed: {append_per_sec}"

          # fork cost in ns. Gate: < 1 ms at 10^6 entries.
          print(f"fork cost: {fork_ns:,.1f} ns (gate < 1_000_000 ns)")
          assert fork_ns < 1_000_000.0, f"fork gate failed: {fork_ns} ns"
          print("storage budget gate: PASS")
          EOF

  sim-gate:
    name: Sim benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Run sim-throughput benchmark and enforce >= 10^6 events/s
        run: |
          cargo bench -p ledger-sim --bench sim_throughput \
            -- --output-format bencher > /tmp/sim_bench.txt 2>&1
          python3 - <<'EOF'
          import re
          # bencher: "test sim_throughput/events_per_second_4_task ... bench: 4,762,847 ns/iter (+/- ...)"
          # The benchmark lives in a group, so the id carries the group prefix.
          name = "sim_throughput/events_per_second_4_task"
          entries_per_run = 5045.0
          for line in open("/tmp/sim_bench.txt"):
              m = re.match(rf"test {re.escape(name)}\s+\.\.\.\s+bench:\s+([0-9,]+)\s+ns/iter", line)
              if m:
                  ns = float(m.group(1).replace(",", ""))
                  per_sec = entries_per_run / (ns / 1e9)
                  print(f"sim throughput: {per_sec:,.0f} events/s (gate >= 1_000_000)")
                  assert per_sec >= 1_000_000.0, f"sim-throughput gate failed: {per_sec}"
                  print("sim-throughput gate: PASS")
                  raise SystemExit(0)
          raise SystemExit("sim_throughput benchmark not found in output")
          EOF
      - name: Run sim-overhead benchmark and enforce <= 10% CPU at 100k entries/s
        run: |
          cargo bench -p ledger-sim --bench sim_overhead \
            -- --output-format bencher > /tmp/overhead_bench.txt 2>&1
          python3 - <<'EOF'
          import re
          # bencher: "test sim_overhead/cpu_at_100k_entries_per_second ... bench: 4,155,399 ns/iter"
          name = "sim_overhead/cpu_at_100k_entries_per_second"
          entries_per_run = 5045.0
          for line in open("/tmp/overhead_bench.txt"):
              m = re.match(rf"test {re.escape(name)}\s+\.\.\.\s+bench:\s+([0-9,]+)\s+ns/iter", line)
              if m:
                  ns = float(m.group(1).replace(",", ""))
                  per_sec = entries_per_run / (ns / 1e9)
                  cpu_at_100k = 100_000.0 / per_sec * 100.0
                  print(f"sim throughput: {per_sec:,.0f} events/s; CPU at 100k entries/s: {cpu_at_100k:.2f}%")
                  assert cpu_at_100k <= 10.0, f"overhead gate failed: {cpu_at_100k:.2f}% > 10%"
                  print("sim-overhead gate (<= 10% CPU at 100k entries/s): PASS")
                  raise SystemExit(0)
          raise SystemExit("sim_overhead benchmark not found in output")
          EOF

  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      - name: no_std builds for ledger-format and ledger-journal
        run: |
          cargo check -p ledger-format --no-default-features
          cargo check -p ledger-journal --no-default-features
      - name: Feature-combination matrix
        run: |
          cargo hack check -p ledger-format -p ledger-journal --each-feature --all-targets
          cargo hack check -p ledger-sim --each-feature

  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install cargo-audit (pinned, from source)
        run: cargo install --locked cargo-audit --version 0.22.1
      - name: Audit committed Cargo.lock against the RustSec advisory DB
        run: cargo audit
        # A failing audit means a published advisory hits the dependency graph.
        # Fix by bumping the affected crate, not by disabling this job.
        # Known false positives go under `cargo audit --ignore <RUSTSEC-id>`.

  wasm-gate:
    name: Wasm gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip1
      - name: Build debug Wasm guest artifact (needed by determinism tests)
        run: cargo build --target wasm32-wasip1 -p wasm-guest
      - name: Build optimized guest artifact (needed by throughput bench)
        run: cargo build --release --target wasm32-wasip1 -p wasm-guest
      - name: Run Wasm determinism tests
        run: cargo test -p ledger-sim --features backend-wasm --test wasm_differential
      - name: Run corpus-bug-through-guest gate
        run: cargo test -p ledger-sim --features backend-wasm --test wasm_corpus_bug
      - name: Run Wasm throughput benchmark and enforce >= 100k entries/s
        run: |
          cargo bench -p ledger-sim --bench wasm_throughput --features backend-wasm \
            -- --output-format bencher > /tmp/w1_bench.txt 2>&1
          python3 - <<'EOF'
          import re
          # bencher: "test w1_guest_throughput_2000_entries ... bench: 1,677,200 ns/iter"
          name = "w1_guest_throughput_2000_entries"
          entries_per_run = 2000.0
          for line in open("/tmp/w1_bench.txt"):
              m = re.match(rf"test {re.escape(name)}\s+\.\.\.\s+bench:\s+([0-9,]+)\s+ns/iter", line)
              if m:
                  ns = float(m.group(1).replace(",", ""))
                  per_sec = entries_per_run / (ns / 1e9)
                  print(f"Wasm throughput: {per_sec:,.0f} entries/s (gate >= 100_000)")
                  assert per_sec >= 100_000.0, f"Wasm gate failed: {per_sec} entries/s"
                  print("Wasm throughput gate: PASS")
                  raise SystemExit(0)
          raise SystemExit("Wasm benchmark not found in output")
          EOF
